[package]
name = "fishercard"
version = "0.1.0"
edition = "2021"
description = "Flashcards with weekly coverage and typed recall"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "system_fonts", "clipboard", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
